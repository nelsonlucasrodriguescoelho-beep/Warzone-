let jid=null,lid=null,j0=null,lp=null;
addEventListener('pointerdown',e=>{if(!TOUCH||st!='play'||e.target.closest('.tb,.ab'))return;
 if(e.clientX<innerWidth*.4&&jid===null){jid=e.pointerId;j0=[e.clientX,e.clientY];const j=$('tjb'),k=$('tjk');j.style.display=k.style.display='block';j.style.left=e.clientX-70+'px';j.style.top=e.clientY-70+'px';k.style.left=e.clientX-30+'px';k.style.top=e.clientY-30+'px'}
 else if(e.clientX>=innerWidth*.4&&lid===null){lid=e.pointerId;lp=[e.clientX,e.clientY]}});
addEventListener('pointermove',e=>{
 if(e.pointerId==jid){let dx=e.clientX-j0[0],dy=e.clientY-j0[1];const d=Math.hypot(dx,dy),m=Math.min(d,60);if(d>0){dx=dx/d*m;dy=dy/d*m}TJ.x=dx/60;TJ.y=dy/60;$('tjk').style.left=j0[0]+dx-30+'px';$('tjk').style.top=j0[1]+dy-30+'px'}
 else if(e.pointerId==lid){const k=1-.5*ads;yaw-=(e.clientX-lp[0])*.005*k;pit=cl(pit-(e.clientY-lp[1])*.005*k,-1.4,1.4);lp=[e.clientX,e.clientY]}});
const tup=e=>{if(e.pointerId==jid){jid=null;TJ.x=TJ.y=0;$('tjb').style.display=$('tjk').style.display='none'}if(e.pointerId==lid)lid=null};
