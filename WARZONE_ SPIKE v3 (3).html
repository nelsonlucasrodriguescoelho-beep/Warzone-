 if(c.kind==='bot')hit(c.ref,dm,best.hd,pid);
 else if(c.kind==='pl')applyPlayerDmg(c.ref,dm,best.hd,pid);
 else{hurt(dm);if(pid!=='H')sendTo(pid,{t:'hit',hd:best.hd})}
 return best}
function netFire(w){
 const sk=spr*(1-.75*ads);ray.setFromCamera({x:rnd(-1,1)*sk,y:rnd(-1,1)*sk},C);
 const o={x:C.position.x,y:C.position.y,z:C.position.z},d={x:ray.ray.direction.x,y:ray.ray.direction.y,z:ray.ray.direction.z};
 sfx(cur?260:210,.09,.09);
 if(NET.role==='client'){sendHost({t:'shot',o,d,w:cur});tracer(o,{x:o.x+d.x*60,y:o.y+d.y*60,z:o.z+d.z*60})}
 else resolveShot(o,d,w,'H')}
function netRoundReset(){let i=0;for(const k in NET.remotes){const r=NET.remotes[k];const p=spawnOf(i++);r.x=p[0];r.z=p[1];r.hp=100;sendTo(k,{t:'spawn',x:p[0],z:p[1]})}}
function netFigs(dt){const k=Math.min(1,dt*12);
 for(const key in NET.fig){const f=NET.fig[key];let tx=f.tx,tz=f.tz,rot=f.tRot;
  if(NET.role==='host'&&key[0]==='p'){const r=NET.remotes[key.slice(1)];if(!r){dropFig(key);continue}tx=r.x;tz=r.z;rot=r.yaw;f.hp=r.hp}
  f.g.visible=f.hp===undefined||f.hp>0;
  const ox=f.g.position.x,oz=f.g.position.z;f.g.position.x+=(tx-ox)*k;f.g.position.z+=(tz-oz)*k;
  anim(f,dt,Math.hypot(f.g.position.x-ox,f.g.position.z-oz)/Math.max(dt,1e-4));
  let dr=(rot||0)-f.g.rotation.y;dr=Math.atan2(Math.sin(dr),Math.cos(dr));f.g.rotation.y+=dr*k}}
function netClientPlant(dt){
 if(!live){$('pr').textContent='AGUARDANDO O ANFITRIÃO...';return}
 if(spike.on||P.hp<=0)return;
 const inS=Math.hypot(P.x-MAP.site[0],P.z-MAP.site[1])<5&&P.y<1.75;
 if(inS&&key.f){pl+=dt;$('pr').textContent='PLANTANDO '+Math.floor(pl/3*100)+'%';if(pl>=3){pl=0;sendHost({t:'plant',x:P.x,z:P.z})}}
 else{pl=0;$('pr').textContent=inS?(TOUCH?'SEGURE PLANTAR':'SEGURE F PARA PLANTAR'):''}}

/* host */
function setupHost(){
 if(typeof Peer==='undefined'){$('ot').textContent='Multiplayer indisponível: a biblioteca de rede não carregou. Verifique a internet e recarregue a página.';return}
 NET.on=true;NET.role='host';NET.myId='H';buildMap(selMap);NET.code=genCode();
 NET.peer=new Peer('WZ'+NET.code);
 NET.peer.on('open',()=>{$('lobby').style.display='block';$('lcode').textContent=NET.code;$('mpRow').style.display='none';
  $('ot').textContent='Sala criada! Passe o código para seus amigos.';$('ovc').textContent='Quando todos entrarem, toque em INICIAR PARTIDA.';
  $('go').textContent='INICIAR PARTIDA';$('go').onclick=hostBegin;updLobby();setInterval(sendSnap,100)});
 NET.peer.on('connection',c=>{NET.conns[c.peer]=c;c.on('data',d=>onData(c.peer,d));c.on('close',()=>dropPeer(c.peer));c.on('open',updLobby)});
 NET.peer.on('error',e=>{$('ot').textContent='Erro de rede ('+e.type+'). Recarregue a página e crie a sala de novo.'});
}
function hostBegin(){if(!mt)newMatch();sendSnap();st='play';$('ov').style.display='none';$('lobby').style.display='none';
 AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(!TOUCH){try{$('g').requestPointerLock()}catch(e){}}}
function dropPeer(pid){delete NET.conns[pid];const r=NET.remotes[pid];if(r){delete NET.remotes[pid];dropFig('p'+pid);const h=`<b>${r.name}</b> saiu da partida`;feed(h);bcast({t:'kf',h});checkAlive()}updLobby()}
function sendSnap(){
 if(!Object.values(NET.conns).some(c=>c&&c.open))return;
 bcast({t:'snap',mi:MI,rn,live,tr,sc,sp:{on:spike.on,t:spike.t,x:spike.x,z:spike.z},
  bots:bots.map(b=>[b.id,+b.x.toFixed(2),+b.z.toFixed(2),b.hp,b.g.rotation.y]),
  pl:[['H',P.x,P.y,P.z,yaw,pit,cur,P.hp,selAg]].concat(Object.values(NET.remotes).map(r=>[r.pid,r.x,r.y||1.7,r.z,r.yaw||0,r.pit||0,r.cur||0,r.hp,r.ag||0]))})}

/* mensagens */
function onData(pid,d){
 if(!d||!d.t)return;
 if(NET.role==='host'){
  if(d.t==='hello'){NET.nameN++;const i=Object.keys(NET.remotes).length,p=spawnOf(i),name='JOGADOR '+(NET.nameN+1);
   NET.remotes[pid]={pid,name,ag:d.ag|0,x:p[0],z:p[1],y:1.7,yaw:0,pit:0,cur:0,hp:100};mkFig('p'+pid,p[0],p[1],name);
   sendTo(pid,{t:'spawn',x:p[0],z:p[1]});updLobby()}
  else if(d.t==='pos'){const r=NET.remotes[pid];if(r)Object.assign(r,{x:d.x,y:d.y,z:d.z,yaw:d.yaw,pit:d.pit,cur:d.cur,ag:d.ag})}
  else if(d.t==='shot'){const r=NET.remotes[pid];const w=WP[d.w|0];if(!r||r.hp<=0||!w)return;resolveShot(d.o,d.d,w,pid)}
  else if(d.t==='plant'){if(live&&!spike.on&&Math.hypot(d.x-MAP.site[0],d.z-MAP.site[1])<5)plant(d.x,d.z)}
 }else onHostMsg(d)}
function onHostMsg(d){
 switch(d.t){
 case 'snap':onSnap(d);break;
 case 'msg':bn(d.a,d.b,2600,d.c?'#3dd9c9':'#ff4655');break;
 case 'end':mt=false;st='end';showMenu(d.a,'VOLTAR AO MENU');$('go').onclick=()=>location.reload();break;
 case 'kf':feed(d.h);break;
 case 'spawn':P.x=d.x;P.z=d.z;P.hp=100;P.ar=50;P.vx=P.vz=0;break;
 case 'dmg':{const dec=d.v<P.hp;P.hp=d.v;if(dec){$('dm').style.opacity=1;setTimeout(()=>$('dm').style.opacity=0,180);sfx(120,.12,.12,'sawtooth')}break}
 case 'hit':{const h=$('hm');h.className=d.hd?'h':'';h.style.opacity=1;setTimeout(()=>h.style.opacity=0,120);sfx(d.hd?1500:900,.06,.07,'sine');break}
 case 'ult':ult=Math.min(6,ult+1);break;
 case 'tr':tracer(d.o,d.e);break;
 }}
function onSnap(m){
 if(NET.mi!==m.mi){NET.mi=m.mi;buildMap(m.mi)}
 NET.gotSnap=true;
 sc=m.sc;$('s1').textContent=sc[0];$('s2').textContent=sc[1];tr=m.tr;live=m.live;
 if(m.sp.on){if(!spike.m){const mm=new THREE.Mesh(new THREE.BoxGeometry(.5,.25,.35),M(0xff4655,0xff4655));mm.position.set(m.sp.x,.13,m.sp.z);S.add(mm);spike.m=mm}spike.on=true;spike.t=m.sp.t;spike.x=m.sp.x;spike.z=m.sp.z}
 else{if(spike.m){S.remove(spike.m);spike.m=null}spike.on=false}
 if(m.rn!==NET.rnSeen){NET.rnSeen=m.rn;rn=m.rn;ammo=WP.map(w=>w.mag);res=WP.map(w=>w.res);rl=0;ovr=0;chg=AG[selAg].k.map(k=>CH[k])}
 const seenB={};
 for(const [id,x,z,hp,ry] of m.bots){const k='b'+id;seenB[k]=1;let f=NET.fig[k];if(!f)f=mkFig(k,x,z,'BOT '+id);f.tx=x;f.tz=z;f.tRot=ry;f.hp=hp}
 const seenP={};
 for(const [pid,x,y,z,yaw,pit,cur,hp,ag] of m.pl){if(pid===NET.myId)continue;const k='p'+pid;seenP[k]=1;let f=NET.fig[k];if(!f)f=mkFig(k,x,z,pid==='H'?'ANFITRIÃO':'JOGADOR');f.tx=x;f.tz=z;f.tRot=yaw;f.hp=hp}
 for(const k in NET.fig){if((k[0]==='b'&&!seenB[k])||(k[0]==='p'&&!seenP[k]))dropFig(k)}
 if(!NET.entered){NET.entered=true;$('ot').textContent='Conectado à sala! Toque em ENTRAR.';$('ovc').textContent='';$('sel').style.display='none';$('mpRow').style.display='none';$('go').textContent='ENTRAR';$('go').onclick=clientEnter}}
function clientEnter(){mt=true;st='play';$('ov').style.display='none';AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(!TOUCH){try{$('g').requestPointerLock()}catch(e){}}}

/* cliente */
function joinGame(code){
 if(typeof Peer==='undefined'){$('ot').textContent='Multiplayer indisponível: a biblioteca de rede não carregou. Verifique a internet.';return}
 NET.on=true;NET.role='client';$('ot').textContent='Conectando à sala '+code+'...';
 NET.peer=new Peer();
 NET.peer.on('open',id=>{NET.myId=id;const c=NET.peer.connect('WZ'+code,{reliable:true});NET.hostConn=c;
  c.on('open',()=>{c.send({t:'hello',ag:selAg});setInterval(()=>{if(NET.hostConn&&NET.hostConn.open)sendHost({t:'pos',x:P.x,y:P.y,z:P.z,yaw,pit,cur,ag:selAg})},66)});
  c.on('data',d=>onData('H',d));
  c.on('close',()=>{live=false;st='end';showMenu('A conexão com o anfitrião caiu.','VOLTAR AO MENU');$('go').onclick=()=>location.reload()});
  setTimeout(()=>{if(!NET.gotSnap)$('ot').textContent='Não entrei na sala. Confira o código e se o anfitrião já criou a sala.'},10000)});
 NET.peer.on('error',e=>{$('ot').textContent='Erro de rede ('+e.type+'). Confira o código da sala.'});
}
$('mHost').onclick=()=>{if(!NET.on)setupHost()};
$('mJoin').onclick=()=>{if(NET.on)return;const c=($('codeIn').value||'').toUpperCase().replace(/[^A-Z]/g,'');if(c.length!==4){$('ot').textContent='Digite o código de 4 letras da sala.';return}joinGame(c)};
};
</script></body></html>
